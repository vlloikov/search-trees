config:
  validation: true

processors:
  active: true

console-reports:
  active: true

complexity:
  LongMethod:
    allowedLines: 40
  LongParameterList:
    allowedFunctionParameters: 5
  NestedBlockDepth:
    allowedDepth: 4
  TooManyFunctions:
    allowedFunctionsPerFile: 20

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    functionPattern: '[a-z][a-zA-Z0-9]*'
