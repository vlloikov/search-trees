name: Build Pipeline

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Ktlint
        run: ./gradlew ktlintCheck

      - name: Detekt
        run: ./gradlew detekt

  verification:
    name: Verification
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Unit Tests
        run: ./gradlew test

      - name: Generate Kover Report
        run: ./gradlew koverHtmlReport

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: kover-html
          path: build/reports/kover/html

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Generate Dokka
        run: ./gradlew dokkaHtml

      - name: Upload Documentation
        uses: actions/upload-artifact@v4
        with:
          name: dokka-html
          path: build/dokka/html

  Assemble:
    name: Assemble
    runs-on: ubuntu-latest
    needs:
      - verification
      - documentation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Assemble Artifacts
        run: ./gradlew assemble
